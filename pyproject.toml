[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "friendsverse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "openai>=1.40,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
friendsverse = "friendsverse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
