name: T2 ensemble live smoke (manual)

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Model ID; leave blank when set in Actions Variables / Secrets"
        required: false
        type: string

jobs:
  ensemble:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL_ID: ${{ inputs.model_id || vars.LLM_MODEL_ID || secrets.LLM_MODEL_ID }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.LLM_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Check credentials
        run: |
          test -n "$LLM_API_KEY" || (echo "::error::Missing LLM_API_KEY"; exit 1)
          test -n "$LLM_MODEL_ID" || (echo "::error::Missing model ID"; exit 1)
      - name: Generate one real six-character day
        run: |
          python -m friendsverse init --mode ensemble --db /tmp/friendsverse-t2.db
          python -m friendsverse next --db /tmp/friendsverse-t2.db --provider live
          python -m friendsverse inspect --db /tmp/friendsverse-t2.db
      - name: Export grounded episode and relationship evidence
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from friendsverse.store import Store
          db = Path('/tmp/friendsverse-t2.db')
          if db.exists():
              with Store(db) as store:
                  episodes = store.episodes()
                  if episodes:
                      episode = episodes[-1]
                      Path('/tmp/t2-review.json').write_text(
                          episode.model_dump_json(indent=2), encoding='utf-8'
                      )
                      assert len(store.load().positions) == 6
                      assert episode.virtual_day == 1
                      assert len(episode.events) >= 6
                      print('T2 one-day technical acceptance:', len(episode.events), 'events,',
                            len(episode.relationship_changes), 'relationship changes.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t2-ensemble-review
          path: /tmp/t2-review.json
          if-no-files-found: ignore
