name: T1 live LLM validation (manual)

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Model ID (optional when LLM_MODEL_ID is already set in repository Variables or Secrets)"
        required: false
        type: string

jobs:
  live-validation:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL_ID: ${{ inputs.model_id || vars.LLM_MODEL_ID || secrets.LLM_MODEL_ID }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.LLM_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Require repository-level LLM secrets
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Missing LLM_API_KEY: configure an Actions Secret in this repository."
            exit 1
          fi
          if [ -z "$LLM_MODEL_ID" ]; then
            echo "::error::Missing LLM_MODEL_ID: enter model_id at Run workflow, or configure repository Actions Variable LLM_MODEL_ID (or Secret)."
            exit 1
          fi
      - name: Run two real model episodes
        run: |
          python -m friendsverse init --db /tmp/fv-live.db
          python -m friendsverse next --db /tmp/fv-live.db --provider live
          python -m friendsverse next --db /tmp/fv-live.db --provider live
          python -m friendsverse inspect --db /tmp/fv-live.db
      - name: Verify model interactions and persisted memories
        run: |
          python - <<'PY'
          from friendsverse.store import Store
          with Store('/tmp/fv-live.db') as store:
              state = store.load()
              episodes = store.episodes()
              assert len(episodes) == 2, 'Expected two persisted episodes'
              assert all(e.provider == 'live' for e in episodes)
              assert all(any(ev.type == 'speak' for ev in e.events) for e in episodes), 'No live dialogue in at least one episode'
              assert len(state.memories['joey']) > 0 and len(state.memories['chandler']) > 0
              first_ids = {ev.id for ev in episodes[0].events}
              for actor in ('joey', 'chandler'):
                  assert set(episodes[1].prior_memory_ids[actor]) & first_ids, f'{actor} did not receive prior episode memories'
              print('Live T1 transport and cross-episode memory checks passed. Review dialogue quality manually.')
          PY
      - name: Export scripts and memory evidence for human T1 review
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from friendsverse.store import Store
          db = Path('/tmp/fv-live.db')
          if not db.exists():
              print('No database generated; skipping review bundle.')
          else:
              with Store(db) as store:
                  episodes = store.episodes()
                  report = {
                      'validation_scope': 'T1: two-character real-model conversation and prior-memory injection',
                      'limitations': 'Does NOT prove autonomous storyline quality or semantic memory usage.',
                      'episodes': [
                          {
                              'number': ep.number,
                              'script': ep.script,
                              'provider': ep.provider,
                              'prior_memory_ids': ep.prior_memory_ids,
                              'rejected_actions': ep.rejected_actions,
                              'events': [
                                  {
                                      'id': ev.id,
                                      'actor': ev.actor,
                                      'type': ev.type,
                                      'location': ev.location,
                                      'text': ev.text,
                                      'witnesses': ev.witnesses,
                                  }
                                  for ev in ep.events
                              ],
                          }
                          for ep in episodes
                      ],
                  }
                  Path('/tmp/fv-live-review.json').write_text(
                      json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
                  )
                  print('Exported', len(episodes), 'episode(s) for human review.')
          PY
      - name: Upload T1 review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-live-review
          path: /tmp/fv-live-review.json
          if-no-files-found: ignore
