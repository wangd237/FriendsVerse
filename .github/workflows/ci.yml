name: T0-T1 tests

on:
  push:
    branches: [main, feat/story-prototype-t0-t1]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run pytest
        run: python -m pytest -q
      - name: T0 fake smoke
        run: |
          python -m friendsverse init --db /tmp/friendsverse-smoke.db
          python -m friendsverse next --db /tmp/friendsverse-smoke.db --provider fake
          python -m friendsverse next --db /tmp/friendsverse-smoke.db --provider fake
          python -m friendsverse inspect --db /tmp/friendsverse-smoke.db
